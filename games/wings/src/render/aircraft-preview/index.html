<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wings — aircraft preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8fb8e0; font: 12px/1.4 ui-monospace, Menlo, monospace; }
      canvas { display: block; }
      #hud { position: fixed; top: 8px; left: 8px; background: rgba(10, 16, 24, 0.75); color: #e8eef5; padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none; }
      #ctl { position: fixed; top: 8px; right: 8px; background: rgba(10, 16, 24, 0.75); color: #e8eef5; padding: 8px 10px; border-radius: 6px; display: grid; gap: 4px; }
    </style>
  </head>
  <body>
    <div id="hud">loading…</div>
    <div id="ctl">
      <label>throttle <input id="thr" type="range" min="0" max="1" step="0.01" value="0.7" /></label>
      <label><input id="auto" type="checkbox" checked /> auto-animate</label>
      <label><input id="boost" type="checkbox" /> boost</label>
      <label><input id="gear" type="checkbox" checked /> gear down</label>
      <label><input id="fire" type="checkbox" /> fire primary</label>
      <label>quality <select id="q"><option>high</option><option>balanced</option><option>low</option></select></label>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
