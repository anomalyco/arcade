<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="data:,">
<title>Lot / Ashwood</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d0e;color:#d6dddd;font:13px system-ui;--frame-width:min(50vw,calc((100dvh - 48px)*8/9));--frame-height:calc(var(--frame-width)*9/16)}
header{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative;z-index:2}
button,a,select{color:inherit;background:#20282a;border:1px solid #3a4547;border-radius:5px;padding:6px 10px;text-decoration:none;font:inherit}
button[aria-pressed=true]{background:#47595c}#status{margin-left:auto;color:#a2b2b4}
main{display:flex;height:calc(100dvh - 48px);align-items:center;justify-content:center;position:relative}
section{position:relative;width:var(--frame-width);height:var(--frame-height);flex-shrink:0}
iframe{border:0;width:var(--frame-width);height:var(--frame-height);display:block;transform-origin:top left}
label{position:absolute;top:10px;left:12px;background:#091012b8;padding:5px 8px;pointer-events:none;z-index:1}
#theirs iframe{pointer-events:none}
/* Scale the existing surfaces: changing iframe dimensions rebuilds both engines' render targets. */
body[data-mode=flip] section{position:absolute;width:calc(var(--frame-width)*2);height:calc(var(--frame-height)*2)}
body[data-mode=flip] iframe{transform:scale(2)}
body[data-mode=flip] #theirs{visibility:hidden}
body[data-mode=flip][data-side=theirs] #theirs{visibility:visible;pointer-events:none}
@media(max-width:700px){body{--frame-width:min(100vw,calc((100dvh - 100px)*8/9))}header{height:100px;flex-wrap:wrap;padding:8px}main{height:calc(100dvh - 100px);flex-direction:column}#status{margin-left:0}body[data-mode=flip] section{width:var(--frame-width);height:var(--frame-height)}body[data-mode=flip] iframe{transform:none}}
</style>
<header><strong>Lot / Ashwood</strong><select id="viewpoint" aria-label="Viewpoint"><option value="gate">Gate</option><option value="lot">Lot</option><option value="entrance">Entrance</option><option value="lobby">Lobby</option><option value="corridor">Corridor</option></select><button id="split" aria-pressed="true">Side by side</button><button id="flip" aria-pressed="false">Flip</button><button id="switch" hidden>Show Ashwood</button><button id="copy">Copy position</button><a id="open" target="ashwood-position">Open Ashwood here</a><span id="status">Loading both scenes…</span></header>
<main><section id="ours"><label>Lot · click to walk</label><iframe title="Lot" allow="fullscreen; clipboard-write" src="about:blank"></iframe></section><section id="theirs"><label>Ashwood</label><iframe title="Ashwood" allow="fullscreen" src="about:blank"></iframe></section></main>
<script type="module">
const ours=document.querySelector('#ours iframe'),theirs=document.querySelector('#theirs iframe'),status=document.querySelector('#status'),open=document.querySelector('#open');
const params=new URLSearchParams(location.search),viewpoint=document.querySelector('#viewpoint');
const a=new URL('/arcade/lot/',location.href);if(location.port==='5254')a.port='5251';a.searchParams.set('compare','1');
const b=new URL('/',location.href);b.port='5253';b.search='?view=gate&follow=1&shot=1';
const initial=params.get('cam');if(initial)a.searchParams.set('cam',initial);
viewpoint.value=params.get('view')??'gate';a.searchParams.set('view',viewpoint.value);
viewpoint.onchange=()=>{a.searchParams.delete('cam');a.searchParams.set('view',viewpoint.value);ours.src=a.href;const url=new URL(location.href);url.searchParams.delete('cam');url.searchParams.set('view',viewpoint.value);history.replaceState(null,'',url)};
ours.src=a.href;theirs.src=b.href;let latest=null,ack=0,ready=false,applied=null;
const query=p=>[p.x,p.y,p.z,p.yaw,p.pitch,p.fov].join(',');
addEventListener('message',e=>{
 if(e.source===ours.contentWindow&&e.origin===a.origin&&e.data?.type==='lot-camera'){
  latest=e.data;theirs.contentWindow.postMessage({...latest,type:'ashwood-camera'},b.origin);
  const u=new URL(b);u.search='?view=gate';u.searchParams.set('cam',query(latest.pose));open.href=u.href;
 }
 if(e.source===theirs.contentWindow&&e.origin===b.origin&&e.data?.type==='ashwood-camera-applied'){ack=e.data.seq;applied=e.data.pose;ready=e.data.ready;status.textContent=ready?'Camera linked · 68°':'Ashwood loading…';}
});
setInterval(()=>{if(latest&&latest.seq-ack>180)status.textContent='Waiting for Ashwood camera…'},1000);
document.querySelector('#split').onclick=()=>mode('split');document.querySelector('#flip').onclick=()=>mode('flip');
function mode(value){document.body.dataset.mode=value;document.querySelector('#switch').hidden=value!=='flip';document.querySelector('#split').setAttribute('aria-pressed',String(value==='split'));document.querySelector('#flip').setAttribute('aria-pressed',String(value==='flip'));}
document.querySelector('#switch').onclick=()=>{const show=document.body.dataset.side!=='theirs';document.body.dataset.side=show?'theirs':'ours';document.querySelector('#switch').textContent=show?'Show Lot':'Show Ashwood'};
document.querySelector('#copy').onclick=async()=>{if(!latest)return;const u=new URL(location.href);u.searchParams.set('cam',query(latest.pose));await navigator.clipboard.writeText(u.href);status.textContent='Position copied'};
window.compareState=()=>({latest,ack,ready,applied});
</script>
</html>
