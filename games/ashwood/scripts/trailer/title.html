<!doctype html>
<!-- Trailer end card (scripts/trailer only, never part of the game): the home screen's look (analog snow, scanlines,
     vignette, the CH 03 OSD, Rubik Glitch title) animated from performance.now so the stepped-clock recorder
     (scripts/trailer/lib.ts) renders it frame-exactly. `__title.ready` once the fonts are in. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "Ashwood Title"; src: url("/fonts/RubikGlitch-title.woff2"); font-display: block; }
      @font-face { font-family: "Static Type"; src: url("/fonts/SpecialElite-hud.woff2"); font-display: block; }
      html, body { margin: 0; height: 100%; background: #040605; overflow: hidden; }
      #snow { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: screen; }
      .veil {
        position: absolute; inset: 0;
        background:
          repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px),
          radial-gradient(ellipse 75% 70% at 50% 45%, transparent 35%, rgba(1, 3, 2, 0.78) 100%),
          linear-gradient(to bottom, rgba(2, 5, 4, 0.35), transparent 30%, transparent 55%, rgba(2, 5, 4, 0.7));
      }
      .osd {
        position: absolute; font: 600 26px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.12em;
        color: rgba(236, 240, 232, 0.55); text-shadow: 0 0 8px rgba(200, 230, 215, 0.35), 1.5px 0 rgba(255, 80, 80, 0.3), -1.5px 0 rgba(80, 200, 255, 0.3);
      }
      .tl { top: 52px; left: 60px; }
      .bl { bottom: 52px; left: 60px; font-size: 21px; }
      main { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 40px; box-sizing: border-box; }
      h1 {
        position: relative; margin: 0; font: 400 196px/1 "Ashwood Title", sans-serif; letter-spacing: 0.24em; padding-left: 0.24em;
        color: rgba(234, 238, 230, 0.92); text-shadow: 0 0 30px rgba(234, 238, 230, 0.2), 0 0 90px rgba(234, 238, 230, 0.08);
      }
      .url { margin-top: 46px; font: 400 26px/1 "Static Type", monospace; letter-spacing: 0.32em; padding-left: 0.32em; color: rgba(214, 220, 208, 0.62); }
      #fade { position: absolute; inset: 0; background: #000; }
    </style>
  </head>
  <body>
    <canvas id="snow"></canvas>
    <div class="veil"></div>
    <div class="osd tl" id="ch">CH 03</div>
    <div class="osd bl" id="stamp">OCT 19 1984&nbsp;&nbsp;03:08</div>
    <main>
      <h1 id="title">ASHWOOD</h1>
      <div class="url" id="url">anoma.ly/arcade/ashwood</div>
    </main>
    <div id="fade"></div>
    <script type="module">
      const P = new URLSearchParams(location.search)
      const total = Number(P.get("total") ?? 4.7)
      const snow = document.getElementById("snow")
      const W = 320, H = 180
      snow.width = W
      snow.height = H
      const g = snow.getContext("2d")
      const img = g.createImageData(W, H)
      const px = new Uint32Array(img.data.buffer)
      const $ = (id) => document.getElementById(id)
      const title = $("title"), url = $("url"), fade = $("fade"), ch = $("ch"), stamp = $("stamp")
      const clamp = (v) => Math.max(0, Math.min(1, v))
      let t0 = null
      let band = 0.1
      const frame = () => {
        requestAnimationFrame(frame)
        if (t0 === null) return
        const t = (performance.now() - t0) / 1000
        // Snow: a burst on the cut in, settling to the menu's faint level.
        const burst = t < 0.5 ? 1 - t / 0.5 : 0
        band = (band + 0.012) % 1.3
        const b0 = Math.floor((band - 0.15) * H)
        for (let y = 0; y < H; y++) {
          const inBand = y >= b0 && y < b0 + 12
          for (let x = 0; x < W; x++) {
            let v = (Math.random() ** 1.6 * 255) | 0
            if (inBand) v = Math.min(255, v + 40)
            px[y * W + x] = (255 << 24) | (v << 16) | (v << 8) | v
          }
        }
        g.putImageData(img, 0, 0)
        snow.style.opacity = String(0.12 + 0.5 * burst + (Math.random() < 0.08 ? 0.05 : 0))
        // Title: tunes in with a horizontal jitter and colour split, then holds steady.
        const tin = clamp((t - 0.15) / 0.5)
        const jit = (1 - tin) * (1 - tin)
        const jx = (Math.random() - 0.5) * 60 * jit + (Math.random() < 0.04 ? (Math.random() - 0.5) * 14 : 0)
        title.style.opacity = String(t < 0.15 ? 0 : Math.min(1, 0.25 + tin) * (Math.random() < jit * 0.5 ? 0.3 : 1))
        title.style.transform = `translateX(${jx.toFixed(1)}px)`
        const split = 2 + 14 * jit
        title.style.textShadow = `${split}px 0 rgba(255,70,70,${0.35 * (0.3 + jit)}), ${-split}px 0 rgba(70,200,255,${0.35 * (0.3 + jit)}), 0 0 30px rgba(234,238,230,0.2), 0 0 90px rgba(234,238,230,0.08)`
        url.style.opacity = String(clamp((t - 1.1) / 0.6) * 0.9)
        ch.style.opacity = stamp.style.opacity = String(t < 0.1 ? 0 : 1)
        fade.style.opacity = String(Math.max(clamp(1 - t / 0.06), clamp((t - (total - 0.6)) / 0.6)))
      }
      requestAnimationFrame(frame)
      await document.fonts.load('196px "Ashwood Title"')
      await document.fonts.load('26px "Static Type"')
      window.__title = { ready: true, start: () => (t0 = performance.now()) }
    </script>
  </body>
</html>
