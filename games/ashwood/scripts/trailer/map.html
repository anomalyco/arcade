<!doctype html>
<!-- Trailer map shot (scripts/trailer only): the game's own clipboard sheets (dumped by scripts/trailer/map-dump.ts) on
     a clipboard lying on a dark desk in torchlight, with a slow push. Animated from performance.now, so the stepped-clock
     recorder renders it frame-exactly. ?page=<n>&from=x,y,scale,rot&to=x,y,scale,rot&light=x,y (sheet px). -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #030303; overflow: hidden; }
      #desk { position: absolute; inset: -40%; background: #0d0a08; }
      #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
      .board {
        position: absolute; left: -90px; top: -150px; width: 2228px; height: 1823px; border-radius: 26px;
        background: linear-gradient(135deg, #5a3d24, #4a301b 40%, #563a22 70%, #432c18);
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.85), inset 0 0 0 3px rgba(255, 220, 170, 0.06);
      }
      .sheet { position: absolute; left: 0; top: 0; width: 2048px; height: 1583px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55); }
      .under { position: absolute; left: 10px; top: 8px; width: 2048px; height: 1583px; background: #cfc8b4; transform: rotate(0.6deg); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); }
      .clip {
        position: absolute; left: 734px; top: -132px; width: 580px; height: 190px; border-radius: 18px 18px 40px 40px;
        background: linear-gradient(180deg, #d9dcdc, #8f9494 45%, #5d6262 70%, #a3a8a8);
        box-shadow: 0 18px 26px rgba(0, 0, 0, 0.65), inset 0 2px 0 rgba(255, 255, 255, 0.6);
      }
      .clip::after { content: ""; position: absolute; left: 230px; top: 30px; width: 120px; height: 60px; border-radius: 30px; background: #1a1a1a; box-shadow: inset 0 3px 6px #000; }
      #light, #grain, #vig { position: absolute; inset: 0; pointer-events: none; }
      #light { mix-blend-mode: multiply; }
      #grain { mix-blend-mode: overlay; opacity: 0.1; width: 100%; height: 100%; }
      #vig { background: radial-gradient(ellipse 80% 75% at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.7) 100%); }
      #fade { position: absolute; inset: 0; background: #000; }
    </style>
  </head>
  <body>
    <div id="desk"></div>
    <div id="world">
      <div class="board"></div>
      <div class="under"></div>
      <img class="sheet" id="sheet" />
      <div class="clip"></div>
    </div>
    <div id="light"></div>
    <canvas id="grain"></canvas>
    <div id="vig"></div>
    <div id="fade"></div>
    <script type="module">
      const P = new URLSearchParams(location.search)
      const num = (k, d) => (P.get(k) ?? d).split(",").map(Number)
      const page = P.get("page") ?? "0"
      const from = num("from", "1024,790,0.62,-4")
      const to = num("to", "1000,300,1.05,-2.5")
      const lt = num("light", "1000,400")
      const dur = Number(P.get("dur") ?? 5)
      const W = innerWidth, H = innerHeight
      const sheet = document.getElementById("sheet")
      sheet.src = `../../captures/trailer/map/page-${page}.png`
      await sheet.decode()
      const world = document.getElementById("world"), light = document.getElementById("light"), fade = document.getElementById("fade")
      const grain = document.getElementById("grain")
      grain.width = 480
      grain.height = 270
      const gg = grain.getContext("2d")
      const img = gg.createImageData(480, 270)
      const ease = (u) => u * u * (3 - 2 * u)
      let t0 = null
      const frame = () => {
        requestAnimationFrame(frame)
        if (t0 === null) return
        const t = (performance.now() - t0) / 1000
        const u = ease(Math.min(1, t / dur))
        const [fx, fy, s, r] = from.map((v, i) => v + (to[i] - v) * u)
        // Camera: the focus point (sheet px) at screen centre, scaled and rolled about it.
        world.style.transform = `translate(${W / 2}px, ${H / 2}px) rotate(${r}deg) scale(${s}) translate(${-fx}px, ${-fy}px)`
        // Torch: a warm pool on the sheet that drifts a little (hand-held, slow), dark falloff beyond.
        const wob = Math.sin(t * 0.9) * 18 + Math.sin(t * 2.3) * 6
        const lx = (lt[0] - fx + wob) * s, ly = (lt[1] - fy + Math.cos(t * 0.7) * 14) * s
        const rad = 900 * Math.max(0.7, s)
        light.style.background = `radial-gradient(circle ${rad}px at ${W / 2 + lx}px ${H / 2 + ly}px, rgba(255,236,200,1) 0%, rgba(236,206,166,0.92) 28%, rgba(140,110,80,0.6) 52%, rgba(40,30,22,0.75) 78%, rgba(6,5,4,0.97) 100%)`
        const d = img.data
        for (let i = 0; i < d.length; i += 4) {
          const v = 128 + (Math.random() - 0.5) * 255
          d[i] = d[i + 1] = d[i + 2] = v
          d[i + 3] = 255
        }
        gg.putImageData(img, 0, 0)
        fade.style.opacity = String(Math.max(0, 1 - t / 0.5))
      }
      requestAnimationFrame(frame)
      window.__mapShot = { ready: true, start: () => (t0 = performance.now()) }
    </script>
  </body>
</html>
