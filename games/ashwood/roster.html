<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Ashwood: character roster</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #15181c; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #dde; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #ui { position: fixed; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 24px); overflow: auto; }
      .row { display: flex; flex-wrap: wrap; gap: 4px; max-width: 560px; }
      button { font: inherit; color: #dde; background: #262b31; border: 1px solid #3a4048; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
      button.on { background: #c9813a; border-color: #c9813a; color: #111; }
      label { opacity: 0.7; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui">
      <label>Character</label><div class="row" id="chars"></div>
      <label>Animation</label><div class="row" id="clips"></div>
      <label>Speed</label><div class="row" id="speeds"></div>
    </div>
    <script type="module" src="/src/roster/main.ts"></script>
  </body>
</html>
