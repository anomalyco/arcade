<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>BARBARA</title>
    <style>
      html, body { margin: 0; height: 100%; background: #030405; color: #e8eef4; font-family: system-ui, sans-serif; overflow: hidden; }
      #view { width: 100vw; height: 100vh; display: block; }
      #hud { position: fixed; top: 12px; left: 14px; pointer-events: none; font-size: 12px; display: flex; gap: 12px; align-items: center; opacity: 0.55; }
      #prompt { position: fixed; left: 50%; top: 70%; transform: translateX(-50%); pointer-events: none; font-size: 14px; text-shadow: 0 1px 4px #000, 0 0 12px #000; }
      #toast { position: fixed; left: 50%; bottom: 9%; transform: translateX(-50%); pointer-events: none; font: italic 15px Georgia, serif; color: #d8d2c0; text-shadow: 0 1px 6px #000; opacity: 0; transition: opacity 0.6s; text-align: center; max-width: 70vw; z-index: 5; }
      #reticle { position: fixed; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px; border-radius: 50%; background: rgba(230,235,240,0.35); pointer-events: none; }
      /* The search's task (FIND BARBARA): over the woods, never in the way; it fades on its own. */
      #objective { position: fixed; left: 50%; top: 21%; transform: translateX(-50%); pointer-events: none; text-align: center; opacity: 0; transition: opacity 1.4s ease; z-index: 5; }
      #objective.on { opacity: 1; transition-duration: 0.5s; }
      #objective .kicker { font: 600 12px system-ui, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; color: #c9c0a8; text-shadow: 0 1px 4px #000; }
      #objective .kicker:empty { display: none; }
      #objective .rule { width: 132px; height: 1px; margin: 12px auto; background: linear-gradient(90deg, transparent, rgba(239,230,204,0.55), transparent); }
      #objective .task { font: 400 46px/1.05 Georgia, serif; letter-spacing: 0.26em; margin-right: -0.26em; color: #f6eed6; text-shadow: 0 2px 24px rgba(255,214,140,0.28), 0 1px 8px #000; }
      /* What the searchers say, as it reaches you; far-off lines are dimmer. */
      #subs { position: fixed; left: 50%; bottom: 15%; transform: translateX(-50%); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: 72vw; z-index: 5; font: 15px system-ui, sans-serif; color: #efe6cc; text-shadow: 0 1px 4px #000, 0 0 12px #000; }
      #subs div { transition: opacity 0.5s; text-align: center; }
      #subs b { font-weight: 600; color: #f2c96b; margin-right: 0.4em; }
      #subs .far { font-style: italic; color: #cfc7b2; }
      /* The search's next step in plain words (NIGHT.md): small, top left, never a timer. */
      #goal { position: fixed; top: 38px; left: 14px; max-width: min(30em, 60vw); pointer-events: none; font: italic 14px/1.4 Georgia, serif; color: #efe6cc; text-shadow: 0 1px 4px #000, 0 0 10px #000; opacity: 0; transition: opacity 0.8s; z-index: 4; }
      #goal.on { opacity: 0.9; }
      #goal b { display: block; font: 600 10px system-ui, sans-serif; letter-spacing: 0.25em; color: #f2c96b; font-style: normal; margin-bottom: 2px; }
      #room { position: fixed; top: 12px; right: 14px; pointer-events: none; font-size: 12px; text-align: right; line-height: 1.6; opacity: 0.7; text-shadow: 0 1px 3px #000; }
      #room .away { opacity: 0.45; }
      #tuning { position: fixed; left: 50%; top: 46px; transform: translateX(-50%); pointer-events: none; font-size: 13px; color: #efe6cc; text-shadow: 0 1px 4px #000; z-index: 4; }
      /* The Lab quick switch toast (@arcade/kit/lab-quickswitch) sits under the key strip. */
      :root { --lab-quickswitch-top: 44px; }

      /* The shell (@arcade/kit/shell) as a 1996 camcorder's viewfinder over the camp: white OSD type with a little bloom
         and colour bleed, a ▶ cursor, STBY or PAUSE top left, the tape counter and date top right, faint scan lines. */
      .arcade-shell {
        --osd: #f1f0ea; --osd-dim: rgba(241, 240, 234, 0.62);
        --osd-glow: 0 0 1px rgba(241, 240, 234, 0.7), 0 0 10px rgba(241, 240, 234, 0.2), 1px 0 0 rgba(255, 70, 70, 0.22), -1px 0 0 rgba(70, 150, 255, 0.22);
        --shell-font: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --shell-title-font: var(--shell-font);
        --shell-ink: var(--osd); --shell-dim: var(--osd-dim); --shell-edge: rgba(241, 240, 234, 0.3); --shell-field: rgba(241, 240, 234, 0.08);
        --shell-accent: var(--osd); --shell-accent-ink: #0b0c0b; --shell-card: rgba(6, 7, 7, 0.8); --shell-radius: 0; --shell-curtain: #020303;
        --shell-scrim: linear-gradient(90deg, rgba(2,3,3,0.7), rgba(2,3,3,0.36) 36%, rgba(2,3,3,0) 70%), linear-gradient(0deg, rgba(2,3,3,0.55), rgba(2,3,3,0) 24%), radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5));
        --shell-backdrop: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 1px, rgba(0,0,0,0) 1px 3px);
        --shell-title-size: 56px; --shell-item-size: 16px;
        --shell-in: 0.42s; --shell-stagger: 0.05s; --shell-rise: 4px;
      }
      .arcade-shell .as-title { font-weight: 500; letter-spacing: 0.34em; text-shadow: var(--osd-glow); }
      .arcade-shell .as-sub { font-size: 13px; text-shadow: var(--osd-glow); }
      .arcade-shell .as-btn { font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; text-shadow: var(--osd-glow); opacity: 0.7; }
      .arcade-shell .as-btn small { font-size: 11px; letter-spacing: 0.06em; text-transform: none; }
      .arcade-shell .as-btn::before { content: "▶"; width: auto; height: auto; margin-top: -0.5em; left: 1px; line-height: 1; font-size: 0.6em; background: none; border-radius: 0; color: var(--osd); text-shadow: var(--osd-glow); opacity: 0; transform: translateX(-3px); transition: opacity 0.12s, transform 0.16s var(--shell-ease); }
      .arcade-shell .as-btn:hover:not(:disabled), .arcade-shell .as-btn:focus-visible, .arcade-shell .as-card:not(:has(.as-btn:hover)) .as-primary:not(:disabled) { background: none; }
      .arcade-shell .as-btn:hover:not(:disabled)::before, .arcade-shell .as-btn:focus-visible::before, .arcade-shell .as-card:not(:has(.as-btn:hover)) .as-primary:not(:disabled)::before { opacity: 1; transform: none; }
      .arcade-shell .as-row, .arcade-shell .as-head, .arcade-shell .as-load-label, .arcade-shell .as-field > span { text-transform: uppercase; letter-spacing: 0.14em; font-size: 12px; text-shadow: var(--osd-glow); }
      .arcade-shell input[type=text] { font-size: 14px; letter-spacing: 0.06em; border-bottom-style: dashed; }
      .arcade-shell .as-inline { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 500; font-size: 11px; background: none; box-shadow: inset 0 0 0 1px var(--shell-edge); }
      .arcade-shell .as-controls { text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; --akc-face: transparent; --akc-ink: var(--osd); }
      .arcade-shell .as-controls .akc-cap, .arcade-shell .as-vol .akc-cap { box-shadow: inset 0 0 0 1px var(--osd-dim); border-radius: 2px; }
      .arcade-shell .as-controls .akc-hold .akc-cap { border-radius: 999px; }
      .arcade-shell .as-vol output { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; text-shadow: var(--osd-glow); }
      /* The volume as an OSD level: segments that fill from the left. */
      .arcade-shell input[type=range] { appearance: none; -webkit-appearance: none; height: 18px; background: none; cursor: pointer; }
      .arcade-shell .as-vol input[type=range] { width: 150px; }
      .arcade-shell input[type=range]::-webkit-slider-runnable-track { height: 9px; background: linear-gradient(90deg, var(--osd) var(--v, 80%), rgba(241,240,234,0.22) var(--v, 80%)); -webkit-mask: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 9px); mask: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 9px); }
      .arcade-shell input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 1px; height: 9px; background: transparent; }
      .arcade-shell input[type=range]::-moz-range-track { height: 9px; background: linear-gradient(90deg, var(--osd) var(--v, 80%), rgba(241,240,234,0.22) var(--v, 80%)); }
      .arcade-shell input[type=range]::-moz-range-thumb { width: 1px; height: 9px; border: 0; background: transparent; }
      .arcade-shell .as-field input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; margin: 0; box-shadow: inset 0 0 0 1px var(--osd-dim); cursor: pointer; }
      .arcade-shell .as-field input[type=checkbox]:checked { background: var(--osd); box-shadow: inset 0 0 0 3px #0b0c0b, 0 0 0 1px var(--osd); }
      .arcade-shell .as-field select { font-size: 13px; letter-spacing: 0.06em; background: none; box-shadow: inset 0 0 0 1px var(--shell-edge); }
      .arcade-shell .as-seg, .arcade-shell .as-pick { background: none; box-shadow: inset 0 0 0 1px var(--shell-edge); }
      .arcade-shell .as-bar { height: 9px; background: rgba(241, 240, 234, 0.16); -webkit-mask: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 9px); mask: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 9px); }
      .arcade-shell .as-bar i { background: var(--osd); }
      .osd { position: absolute; top: max(28px, 5vh); font: 500 15px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.14em; color: var(--osd); text-shadow: var(--osd-glow); font-variant-numeric: tabular-nums; }
      .osd-tl { left: var(--shell-x); }
      .osd-tr { right: var(--shell-x); text-align: right; }
      /* The game's own HUD stays out of the way while the shell is up (its controls are the shell's hint row). */
      #hud, #room { transition: opacity 0.3s; }
      html[data-shell] #hud, html[data-shell] #room { opacity: 0; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="reticle"></div>
    <div id="prompt"></div>
    <div id="toast"></div>
    <div id="objective" aria-live="polite"><div class="kicker"></div><div class="rule"></div><div class="task"></div></div>
    <div id="subs" aria-live="polite"></div>
    <div id="goal" aria-live="polite"><b>FIND BARBARA</b><span></span></div>
    <div id="room"></div>
    <div id="tuning" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
