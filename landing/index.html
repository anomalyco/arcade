<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade</title>
    <meta name="description" content="Blackout and Getaway. Browser games by Anomaly." />
    <meta name="theme-color" content="#050608" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <span class="mark">Arcade</span>
      <a class="home" href="https://anoma.ly">anoma.ly</a>
    </header>

    <main>
      <a class="game" href="/arcade/blackout/" style="--accent: #46e3ff; --focus: 40% 45%">
        <img src="./src/images/blackout.webp" alt="" width="1440" height="900" />

          <span class="no">01</span>
          <span class="name">Blackout</span>

        </span>

      <a class="game" href="/arcade/getaway/" style="--accent: #ff5a5f; --focus: 48% 50%">
        <img src="./src/images/getaway.webp" alt="" width="1440" height="900" />
        <span class="label">
          <span class="no">02</span>
          <span class="name">Getaway</span>
          <span class="kind">Cops and robbers</span>
        </span>
        <span class="play">Play</span>
      </a>

    </main>
