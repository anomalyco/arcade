name: carrier

on:
  push:
    branches: [main]
    paths:
      - "games/carrier/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".github/workflows/carrier.yml"
  pull_request:
    paths:
      - "games/carrier/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".github/workflows/carrier.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/carrier
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run check
      - name: Install smoke browser
        run: bunx --no-install playwright-core install --with-deps chromium --only-shell
      - name: Smoke production bundle
        timeout-minutes: 1
        run: bun ../../scripts/smoke.mjs

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-carrier
      cancel-in-progress: false
    defaults:
      run:
        working-directory: games/carrier
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        working-directory: .
      # Every deploy restarts the rooms (games in progress reset): skip it when the build is identical to what is live.
      - run: bun scripts/deploy.ts --if-changed
