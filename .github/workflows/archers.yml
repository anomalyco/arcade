name: archers

on:
  push:
    branches: [main]
    paths:
      - "games/archers/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".github/workflows/archers.yml"
  pull_request:
    paths:
      - "games/archers/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".github/workflows/archers.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/archers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun ../../scripts/check-changed.ts
      - name: Install smoke browser
        # The runner image already has Chrome's system libraries; --with-deps spent ~15 s on apt fonts.
        run: bunx --no-install playwright-core install chromium --only-shell
      - name: Smoke production bundle
        timeout-minutes: 1
        run: bun ../../scripts/smoke.mjs
      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx --no-install wrangler deploy
