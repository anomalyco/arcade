name: lot-probe
on:
  push:
    branches: [lot-smoke]
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        probe: ["base,noOpaque", "noAlpha,noLevel", "noVolumes,noShadowLights", "noLights,noTaa", "dropOpaque0,dropOpaque1", "dropOpaque2,dropOpaque3", "dropOpaque4,dropOpaque5,dropOpaque6"]
    defaults:
      run:
        working-directory: games/lot
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bunx vite build
      - run: bunx --no-install playwright-core install chromium --only-shell
      - name: Probe ${{ matrix.probe }}
        timeout-minutes: 20
        env:
          PROBE: ${{ matrix.probe }}
        run: bun scripts/probe-smoke.mjs
