name: replay-diagnosis
on:
  push:
    branches: [replay-tests]
    paths: [".github/workflows/replay-diagnosis.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Capture full tape for cross-platform comparison
        run: |
          bun -e '
          import { scavenging } from "./games/outbreak/tests/replays/scenarios";
          import { replayHash } from "./packages/kit/sim/replay";
          import { gzipSync, gunzipSync } from "node:zlib";
          const {recording, golden} = JSON.parse(gunzipSync(await Bun.file("games/outbreak/tests/replays/scavenging.json.gz").bytes()).toString());
          const state = scavenging.init(recording);
          const snapshots = [];
          for (let tick = 0; tick <= recording.inputs.length; tick++) {
            if (tick) scavenging.step(state, recording.inputs[tick - 1], recording.tickDt);
            snapshots.push(state.toSnapshot());
          }
          await Bun.write("linux-tape.json.gz", gzipSync(JSON.stringify(snapshots)));'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tape
          path: linux-tape.json.gz
