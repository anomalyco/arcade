name: outbreak

on:
  push:
    branches: [main]
    paths:
      - "games/outbreak/**"
      - "games/getaway/public/sfx/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".github/workflows/outbreak.yml"
  pull_request:
    paths:
      - "games/outbreak/**"
      - "games/getaway/public/sfx/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".github/workflows/outbreak.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/outbreak
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run check
      - name: Install smoke browser
        # The runner image already has Chrome's system libraries; --with-deps spent ~15 s on apt fonts.
        run: bunx --no-install playwright-core install chromium --only-shell
      - name: Smoke production bundle
        timeout-minutes: 1
        run: bun ../../scripts/smoke.mjs
      - name: Probe boot (temporary diagnostics, main vs branch)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          git fetch -q --depth=1 origin main
          git worktree add -q /tmp/main FETCH_HEAD
          (cd /tmp/main && bun install --frozen-lockfile >/dev/null && cd games/outbreak && bun run build >/dev/null 2>&1)
          for round in 1 2; do
            for v in main branch; do
              root=dist/arcade/outbreak; [ $v = main ] && root=/tmp/main/games/outbreak/dist/arcade/outbreak
              echo "== $v round $round"
              SMOKE_GPU=swiftshader PROBE=$([ $round = 1 ] && echo 1) IDLE=1 timeout 240 bun scripts/smoke-probe.mjs /tmp/$v-$round.json $root || echo "failed $?"
            done
          done
      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx --no-install wrangler deploy
